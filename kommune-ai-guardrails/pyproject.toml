[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kommune-ai-guardrails"
version = "0.1.0"
description = "Kommune AI Guardrails project"
requires-python = ">=3.10"
dependencies = [
  "sqlite-vec>=0.1.0",
  "sentence-transformers>=2.2.2",
  "pypdf>=3.17.0",
  "pyyaml>=6.0",
  "numpy>=1.24.0",
  "pydantic>=2.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "python-dotenv>=1.0.0",
  "ollama>=0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
