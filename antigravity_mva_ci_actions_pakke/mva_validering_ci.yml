name: MVA & M10 Month-End Automated CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'data/repostings/**'
      - 'backend/app/services/ompostering**'
  workflow_dispatch:
    inputs:
      month:
        description: 'Månedsrapportering (f.eks. M10)'
        required: true
        default: 'M10'
      trigger_reason:
        description: 'Årsak til manuell kjøring'
        required: false
        default: 'Månedsslutt godkjenning'

jobs:
  validate-mva-and-repostings:
    name: MVA Balansekontroll & M10 Validering
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kodebase
        uses: actions/checkout@v4

      - name: Sett opp Python 3.12
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.12'
          cache: 'pip'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pytest pydantic

      - name: Kjøre Automatisk MVA-Balansekontroll (Konto 2130)
        run: |
          python backend/tests/test_mva_balanse_2130.py --export-file data/repostings/Ompostering_Korreksjonsfil_ERP_Eksport_v2.xlsx

      - name: Generer SHA-256 Audit Trail & Rapport
        if: always()
        run: |
          python -c "
          import hashlib, json, datetime
          file_path = 'data/repostings/Ompostering_Korreksjonsfil_ERP_Eksport_v2.xlsx'
          with open(file_path, 'rb') as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          audit_data = {
              'timestamp': datetime.datetime.now().isoformat(),
              'sha256': digest,
              'status': 'PASSED_CI_VERIFICATION'
          }
          with open('mva_audit_report.json', 'w') as out:
              json.dump(audit_data, out, indent=2)
          print(f'SHA-256 Stamp: {digest}')
          "

      - name: Last opp Audit Rapport som Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mva-audit-report-sha256
          path: mva_audit_report.json
          retention-days: 90
